services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-app:latest
    container_name: music-app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=local-docker-dev-secret-key-music-app
      - ALLOWED_HOSTS=*
      - PORT=8000
    volumes:
      - media_data:/app/media
    restart: unless-stopped

volumes:
  media_data:
