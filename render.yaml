services:
  - type: web
    name: wavestream-music-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /music/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      # Optional: Connect Render PostgreSQL database:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: wavestream-db
      #     property: connectionString
